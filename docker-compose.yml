services:
  practo-sales:
    build: .
    image: practo-sales-automation:latest
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATA_DIR: /data
      SHEET_CSV_URL: ${SHEET_CSV_URL:-https://docs.google.com/spreadsheets/d/e/2PACX-1vQTl9Yrc0MVODAlLUTrHvOCJZxrm7bpEMV3xAX1d3UYiXQIeGySyOe8t1Jk8evBTQg2rSeC8akfGfxr/pub?gid=305008958&single=true&output=csv}
      SHEET_SYNC_MINUTES: ${SHEET_SYNC_MINUTES:-15}
      CORS_ORIGIN: ${CORS_ORIGIN:-true}
    volumes:
      - practo_sales_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  practo_sales_data:
