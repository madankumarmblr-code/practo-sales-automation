# Cloudflare Workers — static SPA (UI only)
#
# Workers Builds (dashboard defaults that work with this repo):
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
#
# Local:
#   npm run deploy:cf
#
# Express + SQLite API is NOT deployed here. Host API with Docker/VPS
# and optionally set VITE_API_BASE at build time (see HOSTING.md).

name = "practo-sales-automation"
compatibility_date = "2025-08-12"

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
